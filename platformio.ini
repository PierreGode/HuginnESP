; PlatformIO Project Configuration
; HuginnESP — Multi-board ESP32 scanner firmware
;
; Supported boards:
;   esp32s3box  — Waveshare ESP32-S3-Touch-LCD-4B (N16R8, 4" 480x480 RGB display)
;   esp32c5     — Waveshare ESP32-C5-WIFI6-KIT (16MB flash / 8MB PSRAM, dual-band Wi-Fi 6, no display)
;
; Build a specific board:  pio run -e esp32s3box   |   pio run -e esp32c5
; Upload a specific board: pio run -e esp32c5 -t upload

[platformio]
default_envs = esp32s3box

[env]
framework     = arduino
monitor_speed = 460800
upload_speed  = 921600

; ---------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-4B  (with 480x480 RGB touch display)
; ---------------------------------------------------------------------
[env:esp32s3box]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = esp32-s3-devkitc-1

board_build.mcu                  = esp32s3
board_build.f_cpu                = 240000000L
board_build.flash_size           = 8MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -DHUGINN_BOARD_S3=1
    -DHUGINN_HAS_DISPLAY=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0

; ---------------------------------------------------------------------
; Waveshare ESP32-C5-WIFI6-KIT  (dual-band Wi-Fi 6, BLE 5, no display)
; ESP32-C5-WROOM-1 N16R4 (16MB flash, 4MB PSRAM), single-core RISC-V @240MHz
;
; Uses pioarduino 55.03.38-1 (Arduino 3.3.8 / ESP-IDF 5.5.4) — first wave
; of pioarduino releases with esp32-c5 board definitions. Kept separate
; from the S3 env so the working S3 build isn't disturbed.
;
; ARDUINO_USB_MODE=1 selects USB-Serial-JTAG (HWCDC) — required on C5,
; which lacks the native USB OTG controller used by S2/S3. Without it
; the framework expands `Serial` to `USBSerial`, which doesn't exist
; on this chip and breaks the BLE library compile.
; ---------------------------------------------------------------------
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board    = esp32-c5-devkitc1-n16r4

board_build.f_cpu      = 240000000L
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DHUGINN_BOARD_C5=1
    -DHUGINN_HAS_DISPLAY=0
