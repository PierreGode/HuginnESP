; PlatformIO Project Configuration
; HuginnESP — Multi-board ESP32 scanner firmware
;
; Supported boards:
;   esp32s3box  — Waveshare ESP32-S3-Touch-LCD-4B (N16R8, 4" 480x480 RGB display)
;   esp32c5     — Waveshare ESP32-C5-WIFI6-KIT (16MB flash / 8MB PSRAM, dual-band Wi-Fi 6, no display)
;
; Build a specific board:  pio run -e esp32s3box   |   pio run -e esp32c5
; Upload a specific board: pio run -e esp32c5 -t upload

[platformio]
default_envs = esp32s3box

[env]
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; ---------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-4B  (with 480x480 RGB touch display)
; ---------------------------------------------------------------------
[env:esp32s3box]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = esp32-s3-devkitc-1

board_build.mcu                  = esp32s3
board_build.f_cpu                = 240000000L
board_build.flash_size           = 16MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = default_16MB.csv
board_upload.flash_size          = 16MB

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -DHUGINN_BOARD_S3=1
    -DHUGINN_HAS_DISPLAY=1
    ; Phone dashboard: CDC-NCM Ethernet-over-USB lives behind `usbnet on`.
    ; Pairs with the custom_sdkconfig block below — both must be set or
    ; cleared together (the code uses TinyUSB net APIs that are compiled
    ; in only when CONFIG_TINYUSB_NET_MODE_NCM=y).
    -DHUGINN_USBNET=1
    ; Set HUGINN_GPS_UART=1 to compile in a NEO-6M-style NMEA parser; pins
    ; default to RX=17 TX=16 (override via HUGINN_GPS_RX_PIN / _TX_PIN /
    ; _BAUD / _UART_NUM if your wiring differs).
    -DHUGINN_GPS_UART=0

; pioarduino rebuilds the arduino-esp32 framework libraries from source
; when custom_sdkconfig is present. Required for the iPhone-over-USB-C
; dashboard because the stock 3.1.3 binaries ship TinyUSB without the
; NCM class. First CI build will be slow (~20-40 min) and downloads the
; IDF source; the result is cached. Remove this block + flip
; HUGINN_USBNET to 0 to revert to the stock prebuilt libs.
custom_sdkconfig =
    CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
    CONFIG_PARTITION_TABLE_CUSTOM=y
    CONFIG_TINYUSB_ENABLED=y
    CONFIG_TINYUSB_CDC_ENABLED=y
    CONFIG_TINYUSB_NET_MODE_NCM=y
    CONFIG_TINYUSB_NET_RX_QUEUE_LEN=8
    CONFIG_TINYUSB_NET_TX_QUEUE_LEN=8

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0

; ---------------------------------------------------------------------
; Waveshare ESP32-C5-WIFI6-KIT  (dual-band Wi-Fi 6, BLE 5, no display)
; ESP32-C5-WROOM-1 N16R4 (16MB flash, 4MB PSRAM), single-core RISC-V @240MHz
;
; Uses pioarduino 55.03.38-1 (Arduino 3.3.8 / ESP-IDF 5.5.4) — first wave
; of pioarduino releases with esp32-c5 board definitions. Kept separate
; from the S3 env so the working S3 build isn't disturbed.
;
; ARDUINO_USB_MODE=1 selects USB-Serial-JTAG (HWCDC) — required on C5,
; which lacks the native USB OTG controller used by S2/S3. Without it
; the framework expands `Serial` to `USBSerial`, which doesn't exist
; on this chip and breaks the BLE library compile.
; ---------------------------------------------------------------------
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board    = esp32-c5-devkitc1-n16r4

board_build.f_cpu      = 240000000L
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DHUGINN_BOARD_C5=1
    -DHUGINN_HAS_DISPLAY=0
    ; usbnet (Ethernet-over-USB) is S3-only for now — the C5 build uses
    ; the fixed-function USB-Serial-JTAG controller and cannot host
    ; additional USB classes. Switching the C5 to its USB-OTG peripheral
    ; would unlock composite CDC+NCM but is out of scope for this env.
    -DHUGINN_GPS_UART=0
