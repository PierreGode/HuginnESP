; PlatformIO Project Configuration
; SkimGuard C5 — continuous BLE skimmer detector
;
; Supported in this PlatformIO project:
;   esp32c5-dev  -> ESP32-C5 Dev Board / Waveshare ESP32-C5-WIFI6-KIT (16 MB)
;
; Seeed XIAO ESP32-C5 is supported via scripts/build-xiao.sh (arduino-cli).

[platformio]
default_envs = esp32c5-dev

[env]
framework     = arduino
monitor_speed = 460800
upload_speed  = 921600

[env:esp32c5-dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board    = esp32-c5-devkitc1-n16r4

board_build.f_cpu      = 240000000L
board_build.partitions = default_16MB.csv

build_src_filter =
    +<main.cpp>
    +<ble_scanner.cpp>
    +<runtime_config.cpp>
    +<scan_cycle.cpp>
    +<skimmer_led.cpp>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DHUGINN_BOARD_C5=1
    -DHUGINN_BOARD_XIAO_C5=0
    -DHUGINN_HAS_DISPLAY=0
    -DHUGINN_HAS_GPS=0
    -DHUGINN_HAS_SKIMMER_LED=1
    -DHUGINN_HAS_MODE_BUTTON=0
