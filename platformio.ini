; PlatformIO Project Configuration
; HuginnESP — Multi-board ESP32 scanner firmware
;
; Supported boards:
;   esp32s3box  — Waveshare ESP32-S3-Touch-LCD-4B (N16R8, 4" 480x480 RGB display)
;   esp32c5     — Waveshare ESP32-C5-WIFI6-KIT (16MB flash / 8MB PSRAM, dual-band Wi-Fi 6, no display)
;   esp32       — Generic ESP32 DevKit (classic dual-core LX6, 4MB flash, headless)
;
; Build a specific board:  pio run -e esp32s3box   |   pio run -e esp32c5   |   pio run -e esp32
; Upload a specific board: pio run -e esp32c5 -t upload

[platformio]
default_envs = esp32s3box

[env]
framework     = arduino
monitor_speed = 460800
upload_speed  = 921600

; ---------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-4B  (with 480x480 RGB touch display)
; ---------------------------------------------------------------------
[env:esp32s3box]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = esp32-s3-devkitc-1

board_build.mcu                  = esp32s3
board_build.f_cpu                = 240000000L
board_build.flash_size           = 8MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -DHUGINN_BOARD_S3=1
    -DHUGINN_HAS_DISPLAY=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0

; ---------------------------------------------------------------------
; Waveshare ESP32-C5-WIFI6-KIT  (dual-band Wi-Fi 6, BLE 5, no display)
; ESP32-C5-WROOM-1 N16R4 (16MB flash, 4MB PSRAM), single-core RISC-V @240MHz
;
; Uses pioarduino 55.03.38-1 (Arduino 3.3.8 / ESP-IDF 5.5.4) — first wave
; of pioarduino releases with esp32-c5 board definitions. Kept separate
; from the S3 env so the working S3 build isn't disturbed.
;
; ARDUINO_USB_MODE=1 selects USB-Serial-JTAG (HWCDC) — required on C5,
; which lacks the native USB OTG controller used by S2/S3. Without it
; the framework expands `Serial` to `USBSerial`, which doesn't exist
; on this chip and breaks the BLE library compile.
; ---------------------------------------------------------------------
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board    = esp32-c5-devkitc1-n16r4

board_build.f_cpu      = 240000000L
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DHUGINN_BOARD_C5=1
    -DHUGINN_HAS_DISPLAY=0
    -DHUGINN_HAS_SKIMMER_LED=1
    -DHUGINN_HAS_MODE_BUTTON=1
    -DHUGINN_HAS_ZIGBEE=1

; ---------------------------------------------------------------------
; GPS-enabled variants — same as above but with -DHUGINN_HAS_GPS=1.
; Connect a GT-U7 / NEO-6M (or any NMEA module) to the pins below.
; Override GPS_RX_PIN / GPS_TX_PIN / GPS_UART_NUM here if needed.
; TX is declared but most receive-only breakout boards leave it NC.
; ---------------------------------------------------------------------
[env:esp32s3box-gps]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = esp32-s3-devkitc-1

board_build.mcu                  = esp32s3
board_build.f_cpu                = 240000000L
board_build.flash_size           = 8MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -DHUGINN_BOARD_S3=1
    -DHUGINN_HAS_DISPLAY=1
    -DHUGINN_HAS_GPS=1
    -DGPS_RX_PIN=17
    -DGPS_TX_PIN=18
    -DGPS_UART_NUM=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0

[env:esp32c5-gps]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board    = esp32-c5-devkitc1-n16r4

board_build.f_cpu      = 240000000L
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DHUGINN_BOARD_C5=1
    -DHUGINN_HAS_DISPLAY=0
    -DHUGINN_HAS_SKIMMER_LED=1
    -DHUGINN_HAS_MODE_BUTTON=1
    -DHUGINN_HAS_ZIGBEE=1
    -DHUGINN_HAS_GPS=1
    -DGPS_RX_PIN=17
    -DGPS_TX_PIN=18
    -DGPS_UART_NUM=1

; ---------------------------------------------------------------------
; Generic ESP32 (classic dual-core LX6) — headless, 2.4 GHz WiFi + BLE.
; Works on any ESP32-DevKitC / NodeMCU-32S / Awok v3 / etc. with ≥4 MB
; flash and a CP2102 or CH340 USB-serial chip.
; No display, no PSRAM assumed. Override pins as needed.
; ---------------------------------------------------------------------
[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = esp32dev

board_build.f_cpu      = 240000000L
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHUGINN_BOARD_GENERIC=1
    -DHUGINN_HAS_DISPLAY=0

[env:esp32-gps]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = esp32dev

board_build.f_cpu      = 240000000L
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHUGINN_BOARD_GENERIC=1
    -DHUGINN_HAS_DISPLAY=0
    -DHUGINN_HAS_GPS=1
    -DGPS_RX_PIN=16
    -DGPS_TX_PIN=17
    -DGPS_UART_NUM=2

; ---------------------------------------------------------------------
; Seeed Studio XIAO ESP32-S3  (thumb-sized S3, 8MB flash / 8MB OPI PSRAM,
; no display) — headless 2.4 GHz WiFi + BLE wardrive node.
;
; Same silicon as the Waveshare S3 box, so it reuses HUGINN_BOARD_S3 with
; the display compiled out (HUGINN_HAS_DISPLAY=0), exactly like the C5's
; headless build. The XIAO's USB-C is wired to the S3 USB-Serial-JTAG, so
; ARDUINO_USB_MODE=1 (HWCDC) as on esp32s3box; it enumerates as VID 303a,
; which the Ragnar host's companion detector already recognises. If the
; port never enumerates, flip to native USB-OTG: ARDUINO_USB_MODE=0.
;
; NOT available on S3 silicon: dual-band WiFi (needs the C5 radio) and
; 802.15.4/Zigbee (C5/C6/H2 only) — so those flags are intentionally absent.
; Skimmer LED / mode button are left off to match the S3 box: the XIAO's lone
; LED is a mono active-low user LED on GPIO21, not the addressable RGB the LED
; code drives. Enable HUGINN_HAS_MODE_BUTTON with -DMODE_BTN_PIN=0 (BOOT) if
; you want the wardrive/skimmer toggle.
; ---------------------------------------------------------------------
[env:xiao-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = seeed_xiao_esp32s3

board_build.mcu                  = esp32s3
board_build.f_cpu                = 240000000L
board_build.flash_size           = 8MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -DHUGINN_BOARD_S3=1
    -DHUGINN_BOARD_XIAO_S3=1
    -DHUGINN_HAS_DISPLAY=0

; XIAO ESP32-S3 + GPS on the D7/D6 UART pads (RX=GPIO44, TX=GPIO43).
; Pin defaults also live in config.h so -DHUGINN_HAS_GPS=1 alone is enough.
[env:xiao-s3-gps]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board    = seeed_xiao_esp32s3

board_build.mcu                  = esp32s3
board_build.f_cpu                = 240000000L
board_build.flash_size           = 8MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
    -DHUGINN_BOARD_S3=1
    -DHUGINN_BOARD_XIAO_S3=1
    -DHUGINN_HAS_DISPLAY=0
    -DHUGINN_HAS_GPS=1
    -DGPS_UART_NUM=1
    -DGPS_RX_PIN=44
    -DGPS_TX_PIN=43
