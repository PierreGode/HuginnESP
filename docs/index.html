<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HuginnESP Web Flasher</title>
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
    ></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --fg: #e6e6e6;
        --muted: #8a8f98;
        --accent: #6ea8ff;
        --card: #14171c;
        --border: #232831;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }
      main {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2rem;
      }
      h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
      p.lead { margin: 0 0 1.5rem; color: var(--muted); }
      .actions { display: flex; flex-direction: column; gap: 0.75rem; align-items: flex-start; }
      esp-web-install-button { --esp-tools-button-color: var(--accent); }
      .meta {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        font-size: 0.85rem;
        color: var(--muted);
      }
      .meta code { color: var(--fg); }
      .browser-warn {
        display: none;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: #3a1f1f;
        border: 1px solid #6b2e2e;
        border-radius: 8px;
        color: #f3c8c8;
        font-size: 0.9rem;
      }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>HuginnESP Web Flasher</h1>
      <p class="lead">
        Plug your ESP32-S3 board in via USB, click Connect, and select the serial port.
      </p>

      <div class="actions">
        <esp-web-install-button manifest="manifest.json">
          <button slot="unsupported">
            Your browser doesn't support Web Serial. Use Chrome, Edge, or Opera on desktop.
          </button>
          <button slot="not-allowed">
            Web Serial requires HTTPS. Open this page over HTTPS.
          </button>
        </esp-web-install-button>
      </div>

      <div id="browserWarn" class="browser-warn">
        Web Serial is only available in Chromium-based browsers (Chrome, Edge, Opera) on desktop.
      </div>

      <div class="meta">
        Board: <code>Waveshare ESP32-S3-Touch-LCD-4B</code> &middot;
        Build: <code id="build">-</code>
        <br />
        Source: <a href="https://github.com/PierreGode/HuginnESP">github.com/PierreGode/HuginnESP</a>
      </div>
    </main>

    <script>
      if (!("serial" in navigator)) {
        document.getElementById("browserWarn").style.display = "block";
      }
      fetch("version.json", { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((v) => {
          if (v && v.build) document.getElementById("build").textContent = v.build;
        })
        .catch(() => {});
    </script>
  </body>
</html>
