name: Check C5 builds
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [esp32c5, lilygo-tdongle-c5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: c5-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.board }}
