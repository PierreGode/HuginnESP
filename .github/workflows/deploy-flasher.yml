name: Deploy web flasher

# This repo only serves the web flasher (https://pierregode.github.io/HuginnESP/).
# The firmware is built in the private repo PierreGode/HuginnESPpriv: its
# pipeline uploads the staged site as the artifact "flasher-site" and starts
# this workflow with its run id. This workflow downloads that artifact and
# deploys it to GitHub Pages; it builds nothing. The code in this repo is
# legacy and no longer built.
#
# Secret HUGINN_CI_TOKEN: a fine-grained token with Actions read on
# PierreGode/HuginnESPpriv (to download the artifact).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: HuginnESPpriv workflow run that built the site
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download the site built in HuginnESPpriv
        uses: actions/download-artifact@v4
        with:
          name: flasher-site
          path: site
          repository: PierreGode/HuginnESPpriv
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.HUGINN_CI_TOKEN }}

      # The site must be the flasher and nothing else.
      - name: Check the site
        run: |
          find site -type f | sort
          test -f site/index.html && test -f site/manifest.json && test -f site/version.json
          if find site -type f ! \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.bin' -o -name '*.png' -o -name '*.svg' -o -name '*.ico' \) | grep -q .; then
            echo "Unexpected file type in the site - refusing to deploy"; exit 1
          fi
          cat site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
