name: Build firmware and deploy web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build firmware
        run: pio run -e esp32s3box

      - name: Stage site
        run: |
          mkdir -p site/firmware
          cp -r docs/. site/

          BUILD_DIR=.pio/build/esp32s3box
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found"; exit 1
          fi

          python -m esptool --chip esp32s3 merge_bin \
            --output site/firmware/huginn-esp32s3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0000   "$BUILD_DIR/bootloader.bin" \
            0x8000   "$BUILD_DIR/partitions.bin" \
            0xe000   "$BOOT_APP0" \
            0x10000  "$BUILD_DIR/firmware.bin"

          VERSION="$(date -u +%-m.%-d).${GITHUB_SHA::7}"
          echo "Version: $VERSION"

          jq --arg v "$VERSION" '.version = $v' site/manifest.json > site/manifest.json.tmp
          mv site/manifest.json.tmp site/manifest.json

          echo "{\"build\":\"$VERSION\",\"sha\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
